<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EventEase - Book college events in one click</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar ee-nav">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#" onclick="showView('browse');return false">EventEase</a>
    <div class="ms-auto d-flex gap-2 align-items-center flex-wrap" id="navRight"></div>
  </div>
</nav>

<header class="ee-hero">
  <div class="container">
    <h1>Your next college event is one booking away.</h1>
    <p>Workshops, fests, seminars and sports meets. Pick a date, book your seats, get your ticket code.</p>
    <div class="row g-2 mt-2">
      <div class="col-md-6"><input id="q" class="form-control" placeholder="Search by event name, venue or topic"></div>
      <div class="col-md-4">
        <select id="cat" class="form-select">
          <option value="">All categories</option>
          <option>Workshop</option><option>Seminar</option><option>Cultural</option><option>Sports</option><option>Tech</option><option>Other</option>
        </select>
      </div>
      <div class="col-md-2 d-grid"><button class="btn btn-ee" onclick="loadEvents()">Search</button></div>
    </div>
  </div>
</header>

<main class="container my-4">
  <div id="alertBox"></div>
  <section id="view-browse"><div id="eventList" class="row g-3"></div></section>
  <section id="view-dash" class="d-none"></section>
  <section id="view-create" class="d-none">
    <div class="card ee-card"><div class="card-body">
      <h4 class="mb-3">Create an event</h4>
      <div id="createAlert"></div>
      <div class="mb-3"><label class="form-label">Event name</label><input id="e_title" class="form-control"></div>
      <div class="mb-3"><label class="form-label">Description</label><textarea id="e_desc" rows="3" class="form-control"></textarea></div>
      <div class="row g-3">
        <div class="col-md-4"><label class="form-label">Category</label>
          <select id="e_cat" class="form-select"><option>Workshop</option><option>Seminar</option><option>Cultural</option><option>Sports</option><option>Tech</option><option>Other</option></select></div>
        <div class="col-md-4"><label class="form-label">Venue</label><input id="e_venue" class="form-control"></div>
        <div class="col-md-4"><label class="form-label">Date and time</label><input id="e_date" type="datetime-local" class="form-control"></div>
        <div class="col-md-6"><label class="form-label">Ticket price (Rs., 0 for free)</label><input id="e_price" type="number" min="0" value="0" class="form-control"></div>
        <div class="col-md-6"><label class="form-label">Total seats</label><input id="e_seats" type="number" min="1" class="form-control"></div>
      </div>
      <button class="btn btn-ee mt-3" onclick="submitEvent()">Create event</button>
    </div></div>
  </section>
</main>
<footer class="app-footer">
  <div class="container">
    EventEase<span class="sep">|</span>Developed by <strong>Khuman Ritu</strong>
  </div>
</footer>

<div class="modal fade" id="authModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="authTitle">Log in</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <div id="authAlert"></div>
    <div id="regOnly" class="d-none">
      <div class="mb-3"><label class="form-label">Full name</label><input id="a_name" class="form-control"></div>
      <div class="mb-3"><label class="form-label">I am a</label>
        <select id="a_role" class="form-select"><option value="student">Student (book events)</option><option value="organizer">Organizer (create events)</option></select></div>
    </div>
    <div class="mb-3"><label class="form-label">Email</label><input id="a_email" type="email" class="form-control"></div>
    <div class="mb-3"><label class="form-label">Password</label><input id="a_pass" type="password" class="form-control"></div>
    <button class="btn btn-ee w-100" id="authBtn" onclick="submitAuth()">Log in</button>
    <p class="text-center mt-3 mb-0"><a href="#" id="authSwitch" onclick="toggleAuth();return false">New here? Create an account</a></p>
  </div>
</div></div></div>

<div class="modal fade" id="bookModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title">Book tickets</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <div id="bookAlert"></div>
    <input type="hidden" id="b_event"><input type="hidden" id="b_price">
    <p id="b_name" class="fw-semibold mb-2"></p>
    <label class="form-label">Number of tickets (1 to 5)</label>
    <input id="b_tickets" type="number" min="1" max="5" value="1" class="form-control mb-2" oninput="updateTotal()">
    <p class="mb-3">Total: <strong id="b_total"></strong></p>
    <button class="btn btn-ee w-100" onclick="bookNow()">Confirm booking</button>
  </div>
</div></div></div>

<div class="modal fade" id="listModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title">Attendees</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body" id="listBody"></div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
